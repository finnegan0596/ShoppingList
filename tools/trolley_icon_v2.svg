<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#001E3C"/>
  <!-- Minimalist flat trolley: cream on navy -->
  <g transform="translate(160,140) scale(2.2)">
    <!-- Simplified basket rectangle -->
    <rect x="6" y="8" width="36" height="22" rx="3" ry="3" fill="#FFF8E1" stroke="#001E3C" stroke-width="1.8"/>
    <!-- Handle: simple line -->
    <path d="M8 8 L2 0 L20 0" fill="none" stroke="#FFF8E1" stroke-width="3" stroke-linecap="round"/>
    <!-- Wheels: solid circles -->
    <circle cx="12" cy="40" r="6" fill="#FFF8E1" stroke="#001E3C" stroke-width="1.8"/>
    <circle cx="36" cy="40" r="6" fill="#FFF8E1" stroke="#001E3C" stroke-width="1.8"/>
    <!-- Simple front support -->
    <rect x="42" y="18" width="4" height="18" fill="#FFF8E1"/>
  </g>
</svg>
