<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#001E3C"/>
  <!-- Cleaned trolley: cream fill, thicker navy strokes -->
  <g transform="translate(100,80) scale(2.6)">
    <!-- Basket body -->
    <path d="M3 4h10l6.5 24c0.3 1.1 1.2 1.9 2.3 1.9h28c1.2 0 2.1-0.9 2.1-2.1V24H18L15 8H3z"
          fill="#FFF8E1" stroke="#001E3C" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Handle -->
    <path d="M6 4 L3 0 L12 0 L18 8" fill="none" stroke="#FFF8E1" stroke-width="3" stroke-linecap="round"/>
    <!-- Front fork/support -->
    <path d="M30 20 L36 36" fill="none" stroke="#FFEFD5" stroke-width="3" stroke-linecap="round"/>
    <!-- Basket grid lines -->
    <line x1="10" y1="12" x2="36" y2="12" stroke="#001E3C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="36" y2="18" stroke="#001E3C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="16" y1="8" x2="16" y2="28" stroke="#001E3C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="24" y1="8" x2="24" y2="28" stroke="#001E3C" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="12" cy="44" r="6" fill="#001E3C" stroke="#001E3C" stroke-width="1.6"/>
    <circle cx="34" cy="44" r="6" fill="#001E3C" stroke="#001E3C" stroke-width="1.6"/>
    <!-- Wheel rims (cream) -->
    <circle cx="12" cy="44" r="3" fill="#FFF8E1"/>
    <circle cx="34" cy="44" r="3" fill="#FFF8E1"/>
  </g>
</svg>
