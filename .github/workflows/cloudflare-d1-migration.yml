name: Cloudflare D1 migration

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-d1-migration.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-d1-migration.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install --no-save wrangler

      - name: Apply D1 migrations to preview
        run: npx wrangler d1 migrations apply shopping-list --env preview --remote

      - name: Apply D1 migrations to production
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: npx wrangler d1 migrations apply shopping-list --env production --remote
