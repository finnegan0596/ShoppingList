name: Cloudflare D1 migration

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-d1-migration.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-d1-migration.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Cloudflare secrets
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare secrets missing; skipping migration."

      - name: Install Wrangler
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm install --no-save wrangler

      - name: Validate D1 migrations on PR
        if: ${{ github.event_name == 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 migrations apply shopping-list --env production --remote --dry-run

      - name: Apply D1 migrations to production on main
        if: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 migrations apply shopping-list --env production --remote
