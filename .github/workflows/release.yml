name: Build APK and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release and preview APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Determine version
        id: version
        run: echo "name=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             GroceryBuddy-${{ steps.version.outputs.name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk \
             GroceryBuddy-${{ steps.version.outputs.name }}-preview-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: GroceryBuddy ${{ steps.version.outputs.name }}
          body: |
            Automated build from commit ${{ github.sha }}.

            Two APKs are attached — check which API each one talks to:

            | Asset | API target |
            | --- | --- |
            | `GroceryBuddy-*.apk` | **production** (`grocerybuddy-prod.…workers.dev`) |
            | `GroceryBuddy-*-preview-debug.apk` | **non-prod / preview** (`shopping-list-api.…workers.dev`) |

            Download an APK below and install it on your Android device (you may need to allow installing apps from unknown sources / this browser).
          files: |
            GroceryBuddy-${{ steps.version.outputs.name }}.apk
            GroceryBuddy-${{ steps.version.outputs.name }}-preview-debug.apk
